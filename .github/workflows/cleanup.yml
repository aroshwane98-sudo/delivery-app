name: Weekly Supabase Cleanup

on:
  schedule:
    - cron: '0 0 * * 6' # هەموو ڕۆژێکی شەممە کاتژمێر 12ی شەو
  workflow_dispatch:

jobs:
  clean-database:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase Library
        run: npm install @supabase/supabase-js

      - name: Delete Weekly Data
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient('https://wzfeklnlgcgcdnlxhzvy.supabase.co', 'sb_secret_08JJHSysHsawGIt3IVO90A_mMcz19WA');
          
          async function run() {
            const { error } = await supabase.from('delivery_records').delete().gt('id', 0);
            if (error) {
              console.error('Error:', error);
              process.exit(1);
            }
            console.log('Success!');
          }
          run();
          "
