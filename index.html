<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی گەیاندن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; }
        .modal-scroll { max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body class="text-slate-100 p-4">

    <!-- ١. بەشی چوونەژوورەوە -->
    <div id="loginSection" class="w-full max-w-lg mx-auto bg-slate-800 p-6 rounded-xl shadow-lg mt-10">
        <h2 class="text-2xl font-bold text-center mb-6 text-blue-400">چوونەژوورەوە</h2>
        <form id="loginForm" class="space-y-4">
            <select id="loginUser" required class="w-full p-4 bg-slate-700 rounded-lg border border-slate-600 text-white font-bold">
                <option value="">ناوی سایەق هەڵبژێرە...</option>
                <option value="ئۆنەر">👑 ئۆنەر</option>
                <option value="کاروان">کاروان</option>
                <option value="سەمیع">سەمیع</option>
            </select>
            <button type="submit" class="w-full bg-blue-600 p-4 rounded-lg font-bold text-lg">چوونە ژوور</button>
        </form>
    </div>

    <!-- ٢. بەشی دووگمەکان (٥ دووگمە) -->
    <div id="driverSection" class="hidden w-full max-w-lg mx-auto bg-slate-800 p-6 rounded-xl shadow-lg mt-10">
        <h2 id="welcomeText" class="text-xl font-bold text-center mb-6 text-blue-400">بەخێربێیت</h2>
        <div class="grid grid-cols-1 gap-3">
            <button onclick="openModal()" class="bg-blue-600 p-4 rounded-lg font-bold">1. دەرچوون لە کۆمپانیا</button>
            <button onclick="recordTime('arrival_at_zone_time')" class="bg-indigo-600 p-4 rounded-lg font-bold">2. گەشتنە ناو زۆن</button>
            <button onclick="recordTime('departure_from_zone_time')" class="bg-amber-600 p-4 rounded-lg font-bold">3. دەرچوون لە زۆن</button>
            <button onclick="recordTime('return_to_company_time', true)" class="bg-emerald-600 p-4 rounded-lg font-bold">4. گەشتنەوە کۆمپانیا</button>
            <!-- دووگمەی پێنجەم بۆ دەستکاری و زانیاریی -->
            <button onclick="openModal()" class="bg-purple-600 p-4 rounded-lg font-bold border-2 border-white/20">5. دەستکاری زانیارییەکان</button>
        </div>
    </div>

    <!-- ٣. مۆداڵی تۆمارکردن و دەستکاری -->
    <div id="departureModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
        <div class="bg-white text-slate-900 p-6 rounded-2xl w-full max-w-md shadow-2xl modal-scroll">
            <h3 class="text-xl font-bold mb-4 text-blue-800 border-b pb-2">زانیارییەکان</h3>
            <form id="departureForm" class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-600">ناوی دابەشکار:</label>
                    <input list="distributors" id="distributor_name" required class="w-full p-3 border rounded-lg bg-gray-50 mt-1">
                    <datalist id="distributors">
                        <option value="سمیع"><option value="عبدالله"><option value="شایان"><option value="هیمداد">
                        <option value="ابراهیم محسن"><option value="ئومێد"><option value="امیر"><option value="هۆشەنگ">
                    </datalist>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">ناوی مەندوب:</label>
                    <input type="text" id="sales_rep_name" class="w-full p-3 border rounded-lg bg-gray-50 mt-1">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-bold text-slate-600">ژمارەی سەیارە:</label>
                        <input type="text" id="car_number" required class="w-full p-3 border rounded-lg bg-gray-50 mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600">ژمارەی وەسڵ:</label>
                        <input type="text" id="invoice_number" class="w-full p-3 border rounded-lg bg-gray-50 mt-1">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-bold text-slate-600">ژمارەی پارچە:</label>
                        <input type="number" id="item_count" class="w-full p-3 border rounded-lg bg-gray-50 mt-1">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600">کێش (کگم):</label>
                        <input type="number" step="0.01" id="cargo_weight" class="w-full p-3 border rounded-lg bg-gray-50 mt-1">
                    </div>
                </div>
                <div class="flex gap-2 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 text-white p-3 rounded-lg font-bold">تۆمارکردن</button>
                    <button type="button" onclick="closeModal()" class="bg-gray-300 p-3 rounded-lg font-bold">داخستن</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://teqzbhdzyhnfxqcautaz.supabase.co/rest/v1/delivery_records";
        const API_KEY = "sb_publishable_b8QZKs1M98SNBt9EsV4Leg_AJFziBxy";
        let currentUser = "";

        function openModal() { document.getElementById('departureModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('departureModal').classList.add('hidden'); }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            if(user) {
                currentUser = user;
                document.getElementById('welcomeText').innerText = "بەخێربێیت، " + user;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('driverSection').classList.remove('hidden');
            }
        });

        document.getElementById('departureForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                driver_name: currentUser,
                distributor_name: document.getElementById('distributor_name').value,
                sales_rep_name: document.getElementById('sales_rep_name').value,
                car_number: document.getElementById('car_number').value,
                invoice_number: document.getElementById('invoice_number').value,
                item_count: parseInt(document.getElementById('item_count').value) || 0,
                cargo_weight: parseFloat(document.getElementById('cargo_weight').value) || 0,
                departure_time: new Date().toTimeString().split(' ')[0]
            };
            
            const res = await fetch(SUPABASE_URL, {
                method: 'POST',
                headers: {'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                const data = await res.json();
                localStorage.setItem("activeTripId", data[0].id);
                alert("بە سەرکەوتوویی تۆمارکرا");
                closeModal();
            } else { alert("هەڵەیەک ڕوویدا"); }
        });

        async function recordTime(field, isFinal = false) {
            const id = localStorage.getItem("activeTripId");
            if(!id) return alert("سەرەتا دەبێت دەرچوون لە کۆمپانیا تۆمار بکەیت!");
            
            const payload = {}; payload[field] = new Date().toTimeString().split(' ')[0];
            await fetch(`${SUPABASE_URL}?id=eq.${id}`, {
                method: 'PATCH',
                headers: {'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            alert("کاتەکە تۆمارکرا!");
            if(isFinal) localStorage.removeItem("activeTripId");
        }
    </script>
</body>
</html>
