<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فۆرمی دابەشکار</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      padding: 15px;
    }

    /* Top Controls Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e1e1e;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px solid #2d2d2d;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .btn-save { background-color: #8e24aa; }
    .btn-save:hover { background-color: #7b1fa2; }
    .btn-print { background-color: #2e7d32; }
    .btn-print:hover { background-color: #1b5e20; }
    .btn-distributor { background-color: #1565c0; }
    .btn-distributor:hover { background-color: #0d47a1; }
    .btn-settings { background-color: #424242; }
    .btn-settings:hover { background-color: #616161; }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .filter-group input, .filter-group select {
      background-color: #2a2a2a;
      border: 1px solid #3d3d3d;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
    }

    /* Table Styling */
    .table-container {
      overflow-x: auto;
      border-radius: 6px;
      border: 1px solid #2d2d2d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #181818;
      font-size: 13px;
    }

    th {
      background-color: #121212;
      color: #64b5f6;
      padding: 10px 6px;
      border: 1px solid #2d2d2d;
      text-align: center;
      white-space: nowrap;
    }

    td {
      border: 1px solid #2a2a2a;
      padding: 4px;
      text-align: center;
    }

    .row-number {
      color: #ffffff;
      font-weight: bold;
      width: 35px;
    }

    .driver-name {
      color: #4fc3f7;
      font-weight: bold;
      width: 130px;
      text-align: right;
      padding-right: 8px;
    }

    input.cell-input {
      width: 100%;
      background-color: #222222;
      border: 1px solid #333333;
      color: #ffffff;
      padding: 6px;
      border-radius: 3px;
      text-align: center;
      outline: none;
    }

    input.cell-input:focus {
      border-color: #1e88e5;
      background-color: #2a2a2a;
    }

    .col-input { min-width: 120px; }
    .col-small { min-width: 85px; }

    /* Modal / Settings Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 12px 15px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #181818;
    }

    .modal-header h3 { font-size: 15px; color: #fff; }
    
    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
    }
    .close-btn:hover { color: #fff; }

    .back-btn {
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      color: #4fc3f7;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    .back-btn:hover { background: #333; }

    .modal-body {
      padding: 15px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track { background: #181818; }
    .modal-body::-webkit-scrollbar-thumb { background: #3d3d3d; border-radius: 3px; }

    .settings-menu-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-menu-btn {
      width: 100%;
      padding: 12px 15px;
      background-color: #282828;
      color: #fff;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.2s;
    }

    .settings-menu-btn:hover {
      background-color: #333;
      border-color: #1e88e5;
    }

    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toggle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #252525;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #333;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #444;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #2e7d32; }
    input:checked + .slider:before { transform: translateX(22px); }
  </style>
</head>
<body>

  <!-- Datatlists -->
  <datalist id="distributors-list">
    <option value="ابراهیم محسن">
    <option value="اسعد بلال">
    <option value="اسماعیل شاخەوان">
    <option value="اسماعیل علی">
    <option value="امیر">
    <option value="بڕوا">
    <option value="بەڵێن">
    <option value="سمیع">
    <option value="سەفین">
    <option value="سەرمەد">
    <option value="شایان">
    <option value="عمر">
    <option value="محمد عبدالرحمان">
    <option value="هیمداد">
    <option value="هۆشەنگ">
    <option value="ئومێد">
    <option value="ڕەوەز">
  </datalist>

  <datalist id="delegates-list">
    <option value="ابراهیم">
    <option value="حسن">
    <option value="ڕابەر">
    <option value="ڕێژوان">
    <option value="زانا">
    <option value="عبد الصمد">
    <option value="عبدواللە">
    <option value="عەلی">
    <option value="قاسم">
    <option value="محمد اسوەد">
    <option value="مووبارەك">
    <option value="ئاری">
    <option value="ئاکام">
  </datalist>

  <!-- Top Action Bar -->
  <div class="top-bar">
    <div class="btn-group">
      <button class="btn btn-save" onclick="saveAllData()">💾 پاشەکەوت</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ پرنتکردن</button>
      <button class="btn btn-distributor">👤 دابەشکار</button>
      <button class="btn btn-settings" onclick="openSettings()" title="ڕێکخستن">⚙️ ڕێکخستن</button>
    </div>

    <div class="filter-group">
      <label>بەروار:</label>
      <input type="date" id="filter-date" value="2026-08-12">

      <label>پیشە:</label>
      <select id="filter-role">
        <option>سابق و دابەشکار</option>
      </select>

      <label>گەڕان بەپێناو:</label>
      <input type="text" placeholder="ناو بنووسە...">
    </div>
  </div>

  <!-- Data Grid Table -->
  <div class="table-container">
    <table id="main-table">
      <thead>
        <tr>
          <th data-col="0">ژمارە ↕</th>
          <th data-col="1">ناوی سایەق ↕</th>
          <th data-col="2">ناوی دابەشکار ↕</th>
          <th data-col="3">ناوی مەندوب ↕</th>
          <th data-col="4">کاتی دەرچوون ↕</th>
          <th data-col="5">کاتی ناو زۆن ↕</th>
          <th data-col="6">کاتی دەرێی زۆن ↕</th>
          <th data-col="7">کاتی گەشتنەوە ↕</th>
          <th data-col="8">کۆی کات ↕</th>
          <th data-col="9">ژمارەی سەیارە ↕</th>
          <th data-col="10">ژمارەی پارچە ↕</th>
          <th data-col="11">ژمارەی وەسڵ ↕</th>
          <th data-col="12">کێشی بار (kg) ↕</th>
          <th data-col="13">کۆی ماندووبوون (%) ↕</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Dynamic Rows -->
      </tbody>
    </table>
  </div>

  <!-- Settings Modal Popup -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      
      <div id="settings-main-view">
        <div class="modal-header">
          <h3>⚙️ ڕێکخستنەکانی فۆرمی دابەشکار</h3>
          <button class="close-btn" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="settings-menu-container">
            <button class="settings-menu-btn" onclick="openDriversSettings()">
              <span>🚚 سایەقەکان</span>
              <span>➔</span>
            </button>
            <button class="settings-menu-btn" onclick="openColumnsSettings()">
              <span>📋 ڕیزەکان (ستوونەکان)</span>
              <span>➔</span>
            </button>
          </div>
        </div>
      </div>

      <div id="settings-drivers-view" style="display: none;">
        <div class="modal-header">
          <button class="back-btn" onclick="backToMainSettings()">⬅️ گەڕانەوە</button>
          <h3>🚚 ویندۆی سایەقەکان</h3>
          <button class="close-btn" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="toggle-list" id="rows-toggle-list"></div>
        </div>
      </div>

      <div id="settings-columns-view" style="display: none;">
        <div class="modal-header">
          <button class="back-btn" onclick="backToMainSettings()">⬅️ گەڕانەوە</button>
          <h3>📋 ویندۆی ڕیزەکان</h3>
          <button class="close-btn" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="toggle-list" id="columns-toggle-list"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const drivers = [
      "احمد کمال", "احمد نصرالدین", "احمد رمضان", "بیلال فارس", "فارس",
      "دیار", "زریان", "ڕیان", "ڕەزا", "سلام", "سمیع", "کاروان",
      "محمد ابراهیم", "محمد اسماعیل", "میرخان", "هەوراز", "هەمزە", "هیوا"
    ];

    const columnsList = [
      { id: 0, name: "ژمارە" }, { id: 1, name: "ناوی سایەق" }, { id: 2, name: "ناوی دابەشکار" },
      { id: 3, name: "ناوی مەندوب" }, { id: 4, name: "کاتی دەرچوون" }, { id: 5, name: "کاتی ناو زۆن" },
      { id: 6, name: "کاتی دەرێی زۆن" }, { id: 7, name: "کاتی گەشتنەوە" }, { id: 8, name: "کۆی کات" },
      { id: 9, name: "ژمارەی سەیارە" }, { id: 10, name: "ژمارەی پارچە" }, { id: 11, name: "ژمارەی وەسڵ" },
      { id: 12, name: "کێشی بار (kg)" }, { id: 13, name: "کۆی ماندووبوون (%)" }
    ];

    const tbody = document.getElementById('table-body');
    const rowsToggleList = document.getElementById('rows-toggle-list');
    const columnsToggleList = document.getElementById('columns-toggle-list');

    drivers.forEach((driver, index) => {
      const row = document.createElement('tr');
      row.id = `driver-row-${index}`;

      row.innerHTML = `
        <td class="row-number" data-col="0">${index + 1}</td>
        <td class="driver-name" data-col="1">${driver}</td>
        <td class="col-input" data-col="2">
          <input type="text" class="cell-input distributor list-toggle-input" list="distributors-list" placeholder="دیاریبکە...">
        </td>
        <td class="col-input" data-col="3">
          <input type="text" class="cell-input delegate list-toggle-input" list="delegates-list" placeholder="دیاریبکە...">
        </td>
        <td class="col-small" data-col="4">
          <input type="text" class="cell-input time-24 dep-time" placeholder="HH:MM" maxlength="5" 
                 oninput="format24HourInput(this); calculateRowData(${index})" 
                 onblur="finalize24HourInput(this); calculateRowData(${index})">
        </td>
        <td class="col-small" data-col="5">
          <input type="text" class="cell-input time-24 in-zone" placeholder="HH:MM" maxlength="5" 
                 oninput="format24HourInput(this)" 
                 onblur="finalize24HourInput(this)">
        </td>
        <td class="col-small" data-col="6">
          <input type="text" class="cell-input time-24 out-zone" placeholder="HH:MM" maxlength="5" 
                 oninput="format24HourInput(this)" 
                 onblur="finalize24HourInput(this)">
        </td>
        <td class="col-small" data-col="7">
          <input type="text" class="cell-input time-24 ret-time" placeholder="HH:MM" maxlength="5" 
                 oninput="format24HourInput(this); calculateRowData(${index})" 
                 onblur="finalize24HourInput(this); calculateRowData(${index})">
        </td>
        <td class="col-small" data-col="8">
          <input type="text" class="cell-input total-time" value="00:00" readonly>
        </td>
        <td class="col-small" data-col="9">
          <input type="number" class="cell-input car-num" placeholder="ژمارە" oninput="calculateRowData(${index})">
        </td>
        <td class="col-small" data-col="10">
          <input type="number" class="cell-input items" value="0" oninput="calculateRowData(${index})">
        </td>
        <td class="col-small" data-col="11">
          <input type="number" class="cell-input receipts" value="0" oninput="calculateRowData(${index})">
        </td>
        <td class="col-small" data-col="12">
          <input type="number" class="cell-input weight" value="0" oninput="calculateRowData(${index})">
        </td>
        <td class="col-small" data-col="13">
          <input type="text" class="cell-input score" value="0%" readonly>
        </td>
      `;

      tbody.appendChild(row);

      const toggleItem = document.createElement('div');
      toggleItem.className = 'toggle-item';
      toggleItem.innerHTML = `
        <span>${index + 1}. ${driver}</span>
        <label class="switch">
          <input type="checkbox" checked onchange="toggleRowVisibility(${index}, this.checked)">
          <span class="slider"></span>
        </label>
      `;
      rowsToggleList.appendChild(toggleItem);
    });

    // Dynamic Mask Input logic strictly for Hours and Minutes (HH:MM)
    function format24HourInput(input) {
      let val = input.value.replace(/\D/g, ''); // Delete all non-digits
      if (val.length > 4) val = val.substring(0, 4);

      if (val.length >= 3) {
        let h = Math.min(parseInt(val.substring(0, 2), 10), 23);
        let m = val.substring(2);
        input.value = String(h).padStart(2, '0') + ':' + m;
      } else {
        input.value = val;
      }
    }

    // Auto-complete formatting when field loses focus (onblur)
    function finalize24HourInput(input) {
      let val = input.value.replace(/\D/g, '');
      if (!val) {
        input.value = '';
        return;
      }

      if (val.length === 1) val = '0' + val + '00';
      else if (val.length === 2) val = val + '00';
      else if (val.length === 3) val = val + '0';

      let h = Math.min(parseInt(val.substring(0, 2), 10), 23);
      let m = Math.min(parseInt(val.substring(2, 4), 10), 59);

      input.value = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('list-toggle-input')) {
        if (document.activeElement === e.target && e.target.dataset.opened === "true") {
          e.target.blur();
          e.target.dataset.opened = "false";
        } else {
          e.target.dataset.opened = "true";
        }
      } else {
        document.querySelectorAll('.list-toggle-input').forEach(input => {
          input.dataset.opened = "false";
        });
      }
    });

    columnsList.forEach((col) => {
      const colToggleItem = document.createElement('div');
      colToggleItem.className = 'toggle-item';
      colToggleItem.innerHTML = `
        <span>${col.name}</span>
        <label class="switch">
          <input type="checkbox" checked onchange="toggleColumnVisibility(${col.id}, this.checked)">
          <span class="slider"></span>
        </label>
      `;
      columnsToggleList.appendChild(colToggleItem);
    });

    function calculateRowData(index) {
      const row = document.getElementById(`driver-row-${index}`);
      if (!row) return;

      const depTime = row.querySelector('.dep-time').value;
      const retTime = row.querySelector('.ret-time').value;
      const totalTimeInput = row.querySelector('.total-time');
      
      let diffMinutes = 0;

      if (depTime.length === 5 && retTime.length === 5) {
        const [depH, depM] = depTime.split(':').map(Number);
        const [retH, retM] = retTime.split(':').map(Number);

        let depDate = new Date(2000, 0, 1, depH, depM);
        let retDate = new Date(2000, 0, 1, retH, retM);

        if (retDate < depDate) {
          retDate.setDate(retDate.getDate() + 1);
        }

        diffMinutes = Math.floor((retDate - depDate) / (1000 * 60));
        const hours = Math.floor(diffMinutes / 60);
        const mins = diffMinutes % 60;

        totalTimeInput.value = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
      } else {
        totalTimeInput.value = "00:00";
      }

      const items = parseFloat(row.querySelector('.items').value) || 0;
      const receipts = parseFloat(row.querySelector('.receipts').value) || 0;
      const weight = parseFloat(row.querySelector('.weight').value) || 0;
      const carNum = parseFloat(row.querySelector('.car-num').value) || 0;

      const totalHours = diffMinutes / 60;
      let scoreCalc = (totalHours * 4) + (items * 0.2) + (receipts * 0.8) + (weight * 0.05);
      if (carNum > 0) scoreCalc += 5;

      const finalPercentage = Math.min(Math.round(scoreCalc), 100);
      row.querySelector('.score').value = `${finalPercentage}%`;
    }

    function toggleRowVisibility(index, isVisible) {
      const row = document.getElementById(`driver-row-${index}`);
      if (row) row.style.display = isVisible ? '' : 'none';
    }

    function toggleColumnVisibility(colIndex, isVisible) {
      const allCells = document.querySelectorAll(`[data-col="${colIndex}"]`);
      allCells.forEach(cell => cell.style.display = isVisible ? '' : 'none');
    }

    function openSettings() {
      document.getElementById('settings-main-view').style.display = 'block';
      document.getElementById('settings-drivers-view').style.display = 'none';
      document.getElementById('settings-columns-view').style.display = 'none';
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function openDriversSettings() {
      document.getElementById('settings-main-view').style.display = 'none';
      document.getElementById('settings-drivers-view').style.display = 'block';
      document.getElementById('settings-columns-view').style.display = 'none';
    }

    function openColumnsSettings() {
      document.getElementById('settings-main-view').style.display = 'none';
      document.getElementById('settings-drivers-view').style.display = 'none';
      document.getElementById('settings-columns-view').style.display = 'block';
    }

    function backToMainSettings() {
      document.getElementById('settings-drivers-view').style.display = 'none';
      document.getElementById('settings-columns-view').style.display = 'none';
      document.getElementById('settings-main-view').style.display = 'block';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    async function saveAllData() {
      const dateVal = document.getElementById('filter-date').value;
      const rows = document.querySelectorAll('#table-body tr');
      const payload = [];

      rows.forEach(row => {
        if (row.style.display === 'none') return;

        const driverName = row.querySelector('.driver-name').innerText;
        const distributor = row.querySelector('.distributor').value;
        const delegate = row.querySelector('.delegate').value;
        const depTime = row.querySelector('.dep-time').value;
        const inZone = row.querySelector('.in-zone').value;
        const outZone = row.querySelector('.out-zone').value;
        const retTime = row.querySelector('.ret-time').value;
        const totTime = row.querySelector('.total-time').value;
        const carNum = parseInt(row.querySelector('.car-num').value) || 0;
        const items = parseInt(row.querySelector('.items').value) || 0;
        const receipts = parseInt(row.querySelector('.receipts').value) || 0;
        const weight = parseFloat(row.querySelector('.weight').value) || 0;
        const score = row.querySelector('.score').value;

        if (distributor || delegate || depTime) {
          payload.push({
            record_date: dateVal,
            driver_name: driverName,
            distributor_name: distributor,
            delegate_name: delegate,
            departure_time: depTime,
            in_zone_time: inZone,
            out_zone_time: outZone,
            return_time: retTime,
            total_time: totTime,
            car_number: carNum,
            item_count: items,
            receipt_count: receipts,
            weight_kg: weight,
            score_percentage: score
          });
        }
      });

      if (payload.length === 0) {
        alert("هیچ داتایەک نەنووسراوە بۆ پاشەکەوتکردن!");
        return;
      }

      if (!supabaseClient) {
        alert("تکایە بەستەری Supabase بنووسە!");
        return;
      }

      const { data, error } = await supabaseClient.from('daily_records').insert(payload);

      if (error) {
        console.error('Error inserting:', error);
        alert('کێشەیەک ڕوویدا لە کاتی پاشەکەوتکردن!');
      } else {
        alert('سەرکەوتووانە زانیارییەکان لە داتابەیس پاشەکەوت کران!');
      }
    }
  </script>
</body>
</html>
