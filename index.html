<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سیستەمی گەیاندن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* بۆ ئەوەی پەڕەکە نەجووڵێت */
        body { touch-action: manipulation; overflow: hidden; }
        .scrollable-content { overflow-y: auto; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen flex items-center justify-center p-4">

    <!-- ١. فۆڕمی چوونەژوورەوە -->
    <div id="loginSection" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h2 class="text-2xl font-bold text-center text-blue-400 mb-6">چوونەژوورەوە</h2>
        <form id="loginForm" class="space-y-4">
            <select id="loginUser" required class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white">
                <option value="">بەکارهێنەر هەڵبژێرە...</option>
                <option value="ئۆنەر">👑 ئۆنەر (Owner)</option>
                <option value="کاروان">کاروان</option>
                <option value="سەمیع">سەمیع</option>
            </select>
            <input type="password" id="loginPass" placeholder="پاسۆڕد" required class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl">چوونە ژوور</button>
        </form>
    </div>

    <!-- ٢. فۆڕمی سایەق -->
    <div id="driverSection" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 hidden">
        <div class="text-center border-b border-slate-700 pb-3 mb-4">
            <h2 id="driverWelcome" class="text-xl font-bold text-blue-400">بەخێربێیت</h2>
            <p id="tripStatus" class="text-xs text-amber-400 mt-1">هیچ گەشتێک چالاک نییە</p>
        </div>
        <div class="space-y-3">
            <button onclick="openModal()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">1. دەرچوون لە کۆمپانیا</button>
            <button onclick="recordTime('arrival_at_zone_time')" class="w-full bg-indigo-600 py-3 rounded-xl font-bold">2. گەشتنە ناو زۆن</button>
            <button onclick="recordTime('departure_from_zone_time')" class="w-full bg-amber-600 py-3 rounded-xl font-bold">3. دەرچوون لە زۆن</button>
            <button onclick="recordTime('return_to_company_time', true)" class="w-full bg-emerald-600 py-3 rounded-xl font-bold">4. گەشتنەوە کۆمپانیا</button>
        </div>
        <p id="driverMsg" class="mt-4 text-center text-sm font-bold"></p>
    </div>

    <!-- مۆداڵی دەرچوون -->
    <div id="departureModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-md border border-slate-700 max-h-[80vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4">زانیاریی دەرچوون</h3>
            <form id="departureForm" class="space-y-3">
                <select id="distributor_name" required class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white">
                    <option value="">ناوی دابەشکار هەڵبژێرە...</option>
                    <option value="سمیع">سمیع</option>
                    <option value="عبدالله">عبدالله</option>
                    <option value="شایان">شایان</option>
                    <option value="هیمداد">هیمداد</option>
                    <option value="ابراهیم محسن">ابراهیم محسن</option>
                    <option value="ئومێد">ئومێد</option>
                    <option value="امیر">امیر</option>
                    <option value="هۆشەنگ">هۆشەنگ</option>
                    <option value="سەرمەد">سەرمەد</option>
                    <option value="سەفین">سەفین</option>
                    <option value="بەڵێن">بەڵێن</option>
                    <option value="بڕوا">بڕوا</option>
                    <option value="ڕەوەز">ڕەوەز</option>
                    <option value="عمر">عمر</option>
                    <option value="اسماعیل علی">اسماعیل علی</option>
                    <option value="اسماعیل شاخەوان">اسماعیل شاخەوان</option>
                    <option value="محمد عبدالرحمان">محمد عبدالرحمان</option>
                    <option value="اسعد بیلال">اسعد بیلال</option>
                </select>
                <input type="text" id="car_number" placeholder="ژمارەی سەیارە" required class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white">
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold">تۆمارکردن</button>
                    <button type="button" onclick="closeModal()" class="bg-slate-600 px-6 py-3 rounded-xl font-bold">داخستن</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ٣. فۆڕمی ئۆنەر -->
    <div id="ownerSection" class="w-full max-w-4xl bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 hidden h-[90vh] flex flex-col">
        <h2 class="text-xl font-bold mb-4 text-emerald-400">کۆگای داتاکان</h2>
        <div class="flex-1 overflow-auto">
            <table class="w-full text-xs">
                <thead class="bg-slate-700"><tr><th class="p-2">سایەق</th><th class="p-2">دابەشکار</th><th class="p-2">سەیارە</th></tr></thead>
                <tbody id="ownerTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const USERS = {"ئۆنەر": "00", "کاروان": "1", "سەمیع": "34"};
        const SUPABASE_URL = "https://teqzbhdzyhnfxqcautaz.supabase.co/rest/v1/delivery_records";
        const API_KEY = "sb_publishable_b8QZKs1M98SNBt9EsV4Leg_AJFziBxy";
        let currentUser = "";
        let activeTripId = localStorage.getItem("activeTripId");

        // Logic
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            if (USERS[user] === pass) {
                currentUser = user;
                document.getElementById('loginSection').classList.add('hidden');
                if(user === "ئۆنەر") document.getElementById('ownerSection').classList.remove('hidden');
                else document.getElementById('driverSection').classList.remove('hidden');
            }
        });

        function openModal() { document.getElementById('departureModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('departureModal').classList.add('hidden'); }

        document.getElementById('departureForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                driver_name: currentUser,
                distributor_name: document.getElementById('distributor_name').value,
                car_number: document.getElementById('car_number').value,
                departure_time: new Date().toTimeString().split(' ')[0]
            };
            const res = await fetch(SUPABASE_URL, {
                method: 'POST',
                headers: {'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                const data = await res.json();
                localStorage.setItem("activeTripId", data[0].id);
                closeModal();
            }
        });

        async function recordTime(field, isFinal = false) {
            const id = localStorage.getItem("activeTripId");
            if(!id) return alert("سەرەتا دەستپێبکە!");
            const payload = {}; payload[field] = new Date().toTimeString().split(' ')[0];
            await fetch(`${SUPABASE_URL}?id=eq.${id}`, {
                method: 'PATCH',
                headers: {'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            alert("سەرکەوتوو بوو!");
            if(isFinal) localStorage.removeItem("activeTripId");
        }
    </script>
</body>
</html>
