<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سیستەمی لۆگینی سایەق و فرە-بار</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            --container-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --input-bg: #f8fafc;
            --input-border: #e2e8f0;
            --input-text: #1e293b;
            --header-bg: #f1f5f9;
            --card-bg: #f8fafc;
            --card-border: #cbd5e1;
            --card-inner-bg: #ffffff;
            --batch-bg: #fef3c7;
            --batch-text: #b45309;
            --batch-border: #fde68a;
            --nav-bg: #ffffff;
            --nav-border: #e2e8f0;
            --modal-bg: #ffffff;
            --time-row-bg: #f8fafc;
            --time-row-border: #cbd5e1;
            --disabled-bg: #e2e8f0;
            --disabled-text: #94a3b8;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            --container-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --input-text: #f8fafc;
            --header-bg: #0f172a;
            --card-bg: #0f172a;
            --card-border: #334155;
            --card-inner-bg: #0f172a;
            --batch-bg: #451a03;
            --batch-text: #fde047;
            --batch-border: #78350f;
            --nav-bg: #0f172a;
            --nav-border: #334155;
            --modal-bg: #1e293b;
            --time-row-bg: #0f172a;
            --time-row-border: #334155;
            --disabled-bg: #334155;
            --disabled-text: #64748b;
        }

        * { box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-gradient);
            background-size: cover;
            direction: rtl;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .container {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            background: var(--container-bg);
            padding: 15px;
            border-radius: 0;
            box-shadow: none;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background 0.3s;
        }

        @media (min-width: 480px) {
            .container {
                max-width: 420px;
                height: 85vh;
                max-height: 750px;
                border-radius: 24px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            }
        }

        .app-screens-wrapper {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 15px;
            scrollbar-width: none;
        }
        .app-screens-wrapper::-webkit-scrollbar { display: none; }

        #loginScreen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
            justify-content: center;
            height: 100%;
        }
        #loginScreen h2 { color: var(--text-primary); margin: 0 0 5px 0; font-size: 24px; font-weight: bold; }
        #loginScreen p { color: var(--text-secondary); font-size: 13px; margin: 0 0 15px 0; }
        .login-input-group { display: flex; flex-direction: column; text-align: right; position: relative; margin-bottom: 12px; }
        .login-input-group input {
            width: 100%; padding: 14px 16px; background: var(--input-bg); border: 1px solid var(--input-border);
            border-radius: 12px; font-size: 15px; outline: none; color: var(--input-text); transition: all 0.3s;
        }
        .login-input-group input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1); }
        .remember-row { display: flex; align-items: center; justify-content: flex-start; gap: 10px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; cursor: pointer; }
        .remember-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #8b5cf6; }
        .btn-login {
            background: #8b5cf6; color: white; border: none; padding: 14px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); transition: background 0.3s;
        }
        .btn-login:hover { background: #7c3aed; }

        #mainApp { display: none; flex-direction: column; height: 100%; }
        .app-tab-content { display: none; }
        .app-tab-content.active { display: block; }

        .header-info { display: flex; justify-content: space-between; background: var(--header-bg); padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; font-weight: bold; color: var(--text-primary); font-size: 14px; }
        .driver-badge { background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-primary); font-weight: bold; }
        .batch-indicator { background: var(--batch-bg); color: var(--batch-text); padding: 8px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 15px; border: 1px solid var(--batch-border); }
        
        .time-buttons-wrapper { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .time-row { display: flex; align-items: center; justify-content: space-between; background: var(--time-row-bg); border: 1px solid var(--time-row-border); padding: 8px 12px; border-radius: 10px; width: 100%; }
        .time-row button { width: 130px; padding: 9px; background: #8b5cf6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; text-align: center; order: 1; }
        .time-row button:disabled { background: var(--disabled-bg); cursor: not-allowed; color: var(--disabled-text); }
        .time-row button:hover:not(:disabled) { background: #7c3aed; }
        .time-display { font-size: 15px; color: var(--text-primary); font-weight: bold; order: 2; }
        
        .next-batch-btn-container { margin-top: 8px; display: none; }
        .btn-next-batch { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; }
        .btn-next-batch:hover { background: #15803d; }

        .bottom-nav {
            display: none; height: 60px; background: var(--nav-bg); border-top: 1px solid var(--nav-border);
            justify-content: space-around; align-items: center; margin: -15px -15px -15px -15px;
            border-bottom-left-radius: 0; border-bottom-right-radius: 0; transition: background 0.3s;
        }
        @media (min-width: 480px) {
            .bottom-nav { border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
        }
        .nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); font-size: 11px; gap: 2px; flex: 1; height: 100%; }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
        .nav-item.active { color: #8b5cf6; font-weight: bold; }

        .settings-container, .data-container { display: flex; flex-direction: column; gap: 12px; margin-top: 5px; }
        .settings-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; color: white; }
        .btn-logout-main { background: #ef4444; } .btn-logout-main:hover { background: #dc2626; }
        .btn-changepass { background: #3b82f6; } .btn-changepass:hover { background: #2563eb; }
        
        .theme-toggle-row { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 10px; font-weight: bold; color: var(--text-primary); font-size: 15px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #8b5cf6; }
        input:checked + .slider:before { transform: translateX(22px); }

        .local-records-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; max-height: calc(100vh - 180px); overflow-y: auto; scrollbar-width: none; }
        .local-records-box::-webkit-scrollbar { display: none; }
        .record-card { background: var(--card-inner-bg); border: 1px solid var(--card-border); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; color: var(--text-primary); }
        .record-card b { color: #8b5cf6; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(3px); overflow-y: auto; padding: 15px; scrollbar-width: none; }
        .modal::-webkit-scrollbar { display: none; }
        .modal-content { background: var(--modal-bg); width: 100%; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; }
        .close-modal { position: absolute; left: 15px; top: 15px; font-size: 24px; font-weight: bold; color: var(--text-secondary); cursor: pointer; }
        
        .form-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 4px; font-weight: bold; color: var(--text-primary); font-size: 12px; }
        .form-group input { padding: 9px 12px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; font-size: 14px; outline: none; color: var(--input-text); }
        .form-group input:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: not-allowed; }
        
        .action-buttons { display: flex; gap: 10px; justify-content: space-between; margin-top: 15px; border-top: 1px solid var(--card-border); padding-top: 12px; }
        .btn { flex: 1; padding: 11px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; color: white; text-align: center; }
        .btn-save { background: #16a34a; } .btn-save:hover { background: #15803d; }
        .btn-update { background: #2563eb; display: none; } .btn-update:hover { background: #1d4ed8; }
        .btn-back { background: #64748b; } .btn-back:hover { background: #475569; }
    </style>
</head>
<body>

<div class="container" id="outerContainer">
    <div id="loginScreen">
        <h2>بەخێر هاتیتەوە</h2>
        <p>تکایە ناوی بەکارهێنەر و تێپەڕەوشە بنووسە</p>
        <form onsubmit="handleLogin(event)">
            <div class="login-input-group">
                <input type="text" id="loginDriverName" list="driversList" required placeholder="ناوی بەکارهێنەر...">
                <datalist id="driversList"></datalist>
            </div>
            <div class="login-input-group">
                <input type="password" id="loginPassword" placeholder="تێپەڕەوشە...">
            </div>
            <div class="remember-row">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">زانیارییەکانم لە بیر بکە</label>
            </div>
            <button type="submit" class="btn-login">چوونە ژوورەوە</button>
        </form>
    </div>

    <div id="mainApp">
        <div class="app-screens-wrapper">
            <!-- ١. تابی گەشت -->
            <div id="tab-truck" class="app-tab-content active">
                <div class="header-info">
                    <span id="currentDate">--/--/----</span>
                    <span id="currentDay">---</span>
                </div>

                <div class="driver-badge">
                    <span>سایەق: <b id="displayDriverName">---</b></span>
                </div>

                <div id="batchIndicator" class="batch-indicator">باری یەکەم</div>

                <div class="time-buttons-wrapper">
                    <div class="time-row">
                        <span class="time-display" id="disp_departure_time">--:--</span>
                        <button id="btn_departure" onclick="handleTimeButtonClick('departure_time')">دەرچوون</button>
                    </div>
                    <div class="time-row">
                        <span class="time-display" id="disp_in_zone_time">--:--</span>
                        <button id="btn_in_zone" onclick="handleTimeButtonClick('in_zone_time')" disabled>ناوزۆن</button>
                    </div>
                    <div class="time-row">
                        <span class="time-display" id="disp_out_zone_time">--:--</span>
                        <button id="btn_out_zone" onclick="handleTimeButtonClick('out_zone_time')" disabled>دەرێی زۆن</button>
                    </div>
                    <div class="time-row">
                        <span class="time-display" id="disp_arrival_time">--:--</span>
                        <button id="btn_arrival" onclick="handleTimeButtonClick('arrival_time')" disabled>گەشتنەوە</button>
                    </div>
                </div>

                <div id="nextBatchContainer" class="next-batch-btn-container">
                    <button id="nextBatchBtn" class="btn-next-batch" onclick="startNextBatch()">تۆمارکردنی باری نوێ</button>
                </div>
            </div>

            <!-- ٢. تابی فۆرم -->
            <div id="tab-form" class="app-tab-content">
                <h3 style="color: var(--text-primary); margin-top: 0; font-size: 15px;">فۆرمی تۆمارکراوی گەشت</h3>
                <div class="local-records-box" id="localRecordsList">
                    <p style="color: var(--text-secondary); text-align: center; font-size: 13px;">هیچ دەرچوونێک لە لۆکاڵ نەدۆزراوەتەوە.</p>
                </div>
            </div>

            <!-- ٣. تابی داتا (پارەی هێنراوە) -->
            <div id="tab-data" class="app-tab-content">
                <h3 style="color: var(--text-primary); margin-top: 0; font-size: 15px;">بەڕێوەبردنی داتا</h3>
                <div class="data-container">
                    <div class="form-group">
                        <label>پارەی هێنراوە (collected_money)</label>
                        <input type="text" id="data_collected_money" placeholder="٠" oninput="handleAmountInput(this)">
                    </div>
                    <button id="btnDataSave" class="btn btn-save" style="margin-top: 5px; padding: 12px;" onclick="saveDataToSupabase()">تۆمارکردن</button>
                    <button id="btnDataUpdate" class="btn btn-update" style="margin-top: 5px; padding: 12px;" onclick="updateDataInSupabase()">گۆڕانکاری</button>
                </div>
            </div>

            <!-- ٤. تابی سێتینگ -->
            <div id="tab-settings" class="app-tab-content">
                <h3 style="color: var(--text-primary); margin-top: 0; font-size: 15px;">ڕێکخستنەکانی هەژمار</h3>
                <div class="settings-container">
                    <div class="theme-toggle-row">
                        <span>دۆخی تاریک (دارک مۆد)</span>
                        <label class="switch">
                            <input type="checkbox" id="themeToggleCheckbox" onchange="toggleDarkMode(this)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <button class="settings-btn btn-changepass" onclick="openChangePasswordModal()">گۆڕینی پاسۆڕد</button>
                    <button class="settings-btn btn-logout-main" onclick="logout()">چوونە دەرەوە</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item active" onclick="switchTab('truck', this)">
                <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.62H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>گەشت</span>
            </button>
            <button class="nav-item" onclick="switchTab('form', this)">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                <span>فۆرم</span>
            </button>
            <button class="nav-item" onclick="switchTab('data', this)">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                <span>داتا</span>
            </button>
            <button class="nav-item" onclick="switchTab('settings', this)">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c-.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                <span>سێتینگ</span>
            </button>
        </div>
    </div>
</div>

<!-- مۆدالی فۆرمی دەرچوون -->
<div id="formModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3 style="margin-top: 0; color: var(--text-primary); font-size: 18px;">تۆمارکردنی زانیاری دەرچوون</h3>
        
        <form id="driverForm" onsubmit="saveFormData(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>ناوی دابەشکار (distributor) *</label>
                    <input type="text" id="distributor" required list="distributorsList" placeholder="ناوی دابەشکار...">
                    <datalist id="distributorsList"></datalist>
                </div>
                <div class="form-group">
                    <label>ناوی مەندوب (delegate) *</label>
                    <input type="text" id="delegate" required list="delegatesList" placeholder="ناوی مەندوب...">
                    <datalist id="delegatesList"></datalist>
                </div>
                <div class="form-group">
                    <label>زۆن (zone) *</label>
                    <input type="text" id="zone" required list="zonesList" placeholder="زۆن...">
                    <datalist id="zonesList"></datalist>
                </div>
                <div class="form-group">
                    <label>ژمارەی سەیارە (vehicle) *</label>
                    <input type="text" id="vehicle" required list="vehiclesList" placeholder="ژمارەی سەیارە...">
                    <datalist id="vehiclesList"></datalist>
                </div>
                <div class="form-group">
                    <label>کێشی بار (cargo_weight) *</label>
                    <input type="number" id="cargo_weight" required placeholder="٠">
                </div>
                <div class="form-group">
                    <label>ژمارەی پارچە (pieces_count) *</label>
                    <input type="number" id="pieces_count" required placeholder="٠">
                </div>
                <div class="form-group">
                    <label>ژمارەی وەسڵ (receipt_number) *</label>
                    <input type="number" id="receipt_number" required placeholder="٠">
                </div>
            </div>

            <div class="action-buttons">
                <button type="button" class="btn btn-back" onclick="closeModal()">گەڕانەوە</button>
                <button type="submit" class="btn btn-save">تۆمارکردن</button>
            </div>
        </form>
    </div>
</div>

<!-- مۆدالی گۆڕینی پاسۆڕد -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closePasswordModal()">&times;</span>
        <h3 style="margin-top: 0; color: var(--text-primary); font-size: 18px;">گۆڕینی تێپەڕەوشە</h3>
        
        <form onsubmit="updatePasswordInSupabase(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>تێپەڕەوشەی ئێستا *</label>
                    <input type="password" id="current_password" required placeholder="پاسۆڕدی ئێستا...">
                </div>
                <div class="form-group">
                    <label>تێپەڕەوشەی نوێ *</label>
                    <input type="password" id="new_password" required placeholder="پاسۆڕدی نوێ...">
                </div>
                <div class="form-group">
                    <label>دووبارەکردنەوەی تێپەڕەوشەی نوێ *</label>

    async function loadDropdownData() {
        try {
            const { data: usersData } = await supabaseClient.from('users').select('*');

                let uniqueUsers = usersData.map(u => u.username || u.name || u.driver_name).filter(Boolean);

                populateListDirect('driversList', uniqueUsers);

            const { data: distData } = await supabaseClient.from('distributors').select('*');

    function populateListDirect(listId, items) {
        const datalist = document.getElementById(listId);
        datalist.innerHTML = '';
        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            datalist.appendChild(opt);
        });
    }

    function populateFlexibleSortedList(listId, dataArray, possibleKeys) {
        const datalist = document.getElementById(listId);
        datalist.innerHTML = '';
        
        let values = [];
        dataArray.forEach(item => {
            let val = null;
            for (let key of possibleKeys) {
                if (item[key]) { val = item[key]; break; }
            }
            if (!val) {
                for (let key in item) {
                    if (item[key] && typeof item[key] !== 'object' && key !== 'id') { val = item[key]; break; }
                }
            }
            if (val) values.push(val);
        });

        values.sort((a, b) => String(a).localeCompare(String(b), 'ckb'));
        values.forEach(val => {
            const option = document.createElement('option');
            option.value = val;
            datalist.appendChild(option);
        });
    }

        const savedDriver = localStorage.getItem('logged_in_driver');
        if (savedDriver) {

        e.preventDefault();
        const usernameInput = document.getElementById('loginDriverName').value.trim();
        const passwordInput = document.getElementById('loginPassword').value.trim();
        const rememberMe = document.getElementById('rememberMe').checked;

        if (!usernameInput) return;

        try {
            const { data: users } = await supabaseClient.from('users').select('*');
            if (users && users.length > 0) {
                let matchedUser = users.find(u => 
                    (u.username === usernameInput || u.name === usernameInput || u.driver_name === usernameInput)
                );

                if (matchedUser) {
                    let dbPassword = matchedUser.password || matchedUser.pass;
                    if (dbPassword && dbPassword !== passwordInput) {
                        alert("تێپەڕەوشە هەڵەیە!");
                        return;
                    }
                }
            }
        } catch (err) {
            console.log("پشکنینی پاسۆڕد تێپەڕی:", err);
        }

        loggedInDriver = usernameInput;
        baseDriverName = usernameInput;

        if (rememberMe) {
            localStorage.setItem('logged_in_driver', loggedInDriver);
        }

        document.getElementById('displayDriverName').textContent = loggedInDriver;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        document.getElementById('bottomNav').style.display = 'flex';

        resetBatchesDataStructure();
        loadExistingDataFromSupabase();

        document.querySelectorAll('.app-tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

        if (tabId === 'form') {
            displayLocalRecords();
        }

    function resetBatchesDataStructure() {
        currentBatch = 1;
        batchRecordIds = {};
        allBatchesData = {
            1: { driver: baseDriverName, distributor: '', delegate: '', zone: '', vehicle: '', cargo_weight: '', pieces_count: '', receipt_number: '', departure_time: null, in_zone_time: null, out_zone_time: null, arrival_time: null, collected_money: '', is_saved: false },

        };

    async function loadExistingDataFromSupabase() {
        const todayStr = new Date().toISOString().split('T')[0];
        
        const { data } = await supabaseClient
            .from('delivery_records')
            .select('*')
            .eq('record_date', todayStr);

        if (data && data.length > 0) {
            let driverRecords = data.filter(rec => rec.driver && rec.driver.includes(loggedInDriver));

            driverRecords.forEach(rec => {
                let bNum = 1;
                if (rec.driver === baseDriverName + ' دوو') bNum = 2;
                else if (rec.driver === baseDriverName + ' سێ') bNum = 3;
                else if (rec.driver === baseDriverName + ' چوار') bNum = 4;
                else if (rec.driver === baseDriverName) bNum = 1;

                if (rec.collected_money !== undefined && rec.collected_money !== null && rec.collected_money !== '' && Number(rec.collected_money) > 0) {
                    rec.is_saved = true;
                }
                allBatchesData[bNum] = rec;
                if (rec.id) batchRecordIds[bNum] = rec.id;
            });
        }
        updateUIForCurrentBatch();
        saveAllBatchesToLocal();
    }

    function saveAllBatchesToLocal() {
        localStorage.setItem('local_batches_' + baseDriverName, JSON.stringify(allBatchesData));

        const container = document.getElementById('localRecordsList');
        const savedDataJson = localStorage.getItem('local_batches_' + baseDriverName);

        if (!savedDataJson) {
            container.innerHTML = `<p style="color: var(--text-secondary); text-align: center; font-size: 13px;">هیچ دەرچوونێک لە لۆکاڵ نەدۆزراوەتەوە.</p>`;
            return;
        }

        try {
            const parsedData = JSON.parse(savedDataJson);
            let htmlContent = '';
            let count = 0;

            for (let bNum in parsedData) {
                let batch = parsedData[bNum];

                    count++;
                    let batchNames = { 1: "یەکەم", 2: "دووەم", 3: "سێیەم", 4: "چوارەم" };
                    htmlContent += `
                        <div class="record-card">
                            <b>باری ${batchNames[bNum]}</b><br>
                            📅 ڕێکەوت: ${batch.record_date || '---'}<br>
                            👤 دابەشکار: ${batch.distributor || '---'}<br>
                            🤝 مەندوب: ${batch.delegate || '---'}<br>
                            📍 زۆن: ${batch.zone || '---'}<br>
                            🚛 سەیارە: ${batch.vehicle || '---'}<br>
                            📦 کێشی بار: ${batch.cargo_weight || 0}<br>
                            🏷️ ژمارەی پارچە: ${batch.pieces_count || 0}<br>
                            🧾 ژمارەی وەسڵ: ${batch.receipt_number || 0}<br>
                            ⏰ دەرچوون: ${batch.departure_time || '--:--'}<br>
                            ⏰ ناوزۆن: ${batch.in_zone_time || '--:--'}<br>
                            ⏰ دەرێی زۆن: ${batch.out_zone_time || '--:--'}<br>
                            ⏰ گەشتنەوە: ${batch.arrival_time || '--:--'}<br>
                            💰 پارەی هێنراوە: ${batch.collected_money || 0}
                        </div>
                    `;
                }
            }

            if (count === 0) {
                container.innerHTML = `<p style="color: var(--text-secondary); text-align: center; font-size: 13px;">هیچ فۆرمێک تۆمار نەکراوە.</p>`;
            } else {
                container.innerHTML = `<p style="font-size: 13px; color: var(--text-primary); margin-top:0;">کۆی فۆرمە تۆمارکراوەکان: <b>${count}</b></p>` + htmlContent;
            }
        } catch (e) {
            container.innerHTML = `<p style="color: #ef4444; text-align: center; font-size: 13px;">هەڵە لە خوێندنەوەی داتای لۆکاڵ.</p>`;
        }

    function updateUIForCurrentBatch() {
        const batchData = allBatchesData[currentBatch] || {};
        let suffix = "";
        let batchNames = { 1: "یەکەم", 2: "دووەم", 3: "سێیەم", 4: "چوارەم" };
        document.getElementById('batchIndicator').textContent = `باری ${batchNames[currentBatch]}`;

        if (currentBatch > 1) { suffix = ` ${currentBatch}`; }

        document.getElementById('btn_departure').textContent = `دەرچوون${suffix}`;
        document.getElementById('btn_in_zone').textContent = `ناوزۆن${suffix}`;
        document.getElementById('btn_out_zone').textContent = `دەرێی زۆن${suffix}`;
        document.getElementById('btn_arrival').textContent = `گەشتنەوە${suffix}`;

        ['departure_time', 'in_zone_time', 'out_zone_time', 'arrival_time'].forEach(field => {
            const disp = document.getElementById(`disp_${field}`);
            if (batchData[field]) {
                let val = batchData[field];
                if (batchData[`${field}_edited`]) val += ' (دەستکاری)';
                disp.textContent = val;
            } else {
                disp.textContent = '--:--';
            }
        });

        let moneyField = document.getElementById('data_collected_money');
        let saveBtn = document.getElementById('btnDataSave');
        let updateBtn = document.getElementById('btnDataUpdate');

        let valToShow = batchData.collected_money;
        if (valToShow !== undefined && valToShow !== '' && valToShow !== null) {
            let cleanVal = String(valToShow).replace(/,/g, '');
            moneyField.value = Number(cleanVal) ? Number(cleanVal).toLocaleString() : cleanVal;
        } else {
            moneyField.value = '';
        }

        if (batchData.is_saved) {
            moneyField.disabled = true;
            saveBtn.style.display = 'none';
            updateBtn.style.display = 'none';
        } else {
            moneyField.disabled = false;
            saveBtn.style.display = 'block';
            updateBtn.style.display = 'none';
        }

        updateButtonStates();
        checkIfBatchCompleted();
        saveAllBatchesToLocal();
    }

    function updateButtonStates() {
        const batchData = allBatchesData[currentBatch];
        document.getElementById('btn_in_zone').disabled = !batchData.departure_time;
        document.getElementById('btn_out_zone').disabled = !batchData.in_zone_time;
        document.getElementById('btn_arrival').disabled = !batchData.out_zone_time;
    }

    function checkIfBatchCompleted() {
        const batchData = allBatchesData[currentBatch];
        const nextContainer = document.getElementById('nextBatchContainer');
        
        if (batchData.departure_time && batchData.in_zone_time && batchData.out_zone_time && batchData.arrival_time) {
            if (currentBatch < 4) {
                let nextBatchNames = { 2: "دووەم", 3: "سێیەم", 4: "چوارەم" };
                document.getElementById('nextBatchBtn').textContent = `تۆمارکردنی باری نوێ (باری ${nextBatchNames[currentBatch + 1]})`;
                nextContainer.style.display = 'block';
            } else {
                nextContainer.style.display = 'none';
            }
        } else {
            nextContainer.style.display = 'none';
        }
    }

    function startNextBatch() {
        if (currentBatch < 4) {
            currentBatch++;
            updateUIForCurrentBatch();
        }
    }

    function handleTimeButtonClick(field) {
        if (field === 'departure_time') {
            activeTimeField = field;
            let batchData = allBatchesData[currentBatch];
            if (batchData[field]) {
                if (!confirm("دەتەوێت زانیارییە تۆمارکراوەکانت دەستکاری بکەیت؟")) return;
            }
            document.getElementById('formModal').style.display = 'block';
        } else {
            let batchData = allBatchesData[currentBatch];
            if (batchData[field]) {
                if (!confirm("دەتەوێت ئەم کاتە دووبارە تۆماربکەیتەوە؟")) return;
            }
            recordTimeOnly(field);
        }
    }

    async function recordTimeOnly(field) {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);
        const todayStr = now.toISOString().split('T')[0];

        let batchData = allBatchesData[currentBatch];
        if (batchData[field]) {
            batchData[`${field}_edited`] = true;
        }

        batchData[field] = timeStr;
        batchData.record_date = todayStr;
        if (!batchData.record_time) { batchData.record_time = timeStr; }
        if (!batchData.driver) {
            let suffixArr = { 1: '', 2: ' دوو', 3: ' سێ', 4: ' چوار' };
            batchData.driver = baseDriverName + suffixArr[currentBatch];
        }

        updateUIForCurrentBatch();

        try {
            let recId = batchRecordIds[currentBatch];
            let updateData = { [field]: timeStr };
            if (batchData[`${field}_edited`]) {
                updateData[`${field}_edited`] = true;
            }

            if (recId) {
                await supabaseClient.from('delivery_records').update(updateData).eq('id', recId);
            } else {
                updateData.record_date = todayStr;
                updateData.driver = batchData.driver;
                updateData.distributor = batchData.distributor || '-';
                updateData.delegate = batchData.delegate || '-';
                updateData.zone = batchData.zone || '-';
                updateData.vehicle = batchData.vehicle || '-';
                updateData.cargo_weight = batchData.cargo_weight || 0;
                updateData.pieces_count = batchData.pieces_count || 0;
                updateData.receipt_number = batchData.receipt_number || 0;
                updateData.record_time = batchData.record_time;
                updateData.collected_money = 0;

                const { data } = await supabaseClient.from('delivery_records').insert([updateData]).select();
                if (data && data.length > 0) {
                    batchRecordIds[currentBatch] = data[0].id;
                    batchData.id = data[0].id;
                }
            }
        } catch (err) {
            console.log("هەڵە لە ناردنی کات بۆ داتابەیس:", err);
        }
    }

    function handleAmountInput(inputElement) {
        let value = inputElement.value.replace(/,/g, '');
        if (!isNaN(value) && value !== '') {
            inputElement.value = Number(value).toLocaleString();
        } else if (value === '') {
            inputElement.value = '';
        }

        let batchData = allBatchesData[currentBatch];
        if (batchData.is_saved) {
            document.getElementById('btnDataSave').style.display = 'none';
            document.getElementById('btnDataUpdate').style.display = 'block';
        }
        saveDataFields();
    }

    function saveDataFields() {
        let batchData = allBatchesData[currentBatch];
        let rawMoney = document.getElementById('data_collected_money').value.replace(/,/g, '');
        batchData.collected_money = rawMoney;
        saveAllBatchesToLocal();
    }

    async function saveDataToSupabase() {
        let batchData = allBatchesData[currentBatch];
        let rawMoney = document.getElementById('data_collected_money').value.replace(/,/g, '').trim();
        let amountBroughtVal = rawMoney === '' ? 0 : Number(rawMoney);
        
        batchData.collected_money = rawMoney;

        if (!batchData.driver) {
            let suffixArr = { 1: '', 2: ' دوو', 3: ' سێ', 4: ' چوار' };
            batchData.driver = baseDriverName + suffixArr[currentBatch];
        }
        
        const todayStr = new Date().toISOString().split('T')[0];
        batchData.record_date = todayStr;

        try {
            let dbData = {
                driver: batchData.driver,
                distributor: batchData.distributor || '-',
                delegate: batchData.delegate || '-',
                zone: batchData.zone || '-',
                vehicle: batchData.vehicle || '-',
                cargo_weight: batchData.cargo_weight || 0,
                pieces_count: batchData.pieces_count || 0,
                receipt_number: batchData.receipt_number || 0,
                record_date: batchData.record_date,
                record_time: batchData.record_time || '00:00',
                in_zone_time: batchData.in_zone_time || null,
                out_zone_time: batchData.out_zone_time || null,
                arrival_time: batchData.arrival_time || null,
                collected_money: amountBroughtVal
            };

            let recId = batchRecordIds[currentBatch];

            if (recId) {
                const { error } = await supabaseClient.from('delivery_records').update(dbData).eq('id', recId);
                if (error) {
                    alert("هەڵە لە نوێکردنەوەی داتا: " + error.message);
                } else {
                    batchData.is_saved = true;
                    alert("داتای پارەی هێنراوە بە سەرکەوتوویی تۆمارکرا!");
                }
            } else {
                const { data, error } = await supabaseClient.from('delivery_records').insert([dbData]).select();
                if (error) {
                    alert("هەڵە لە ناردنی داتا بۆ داتابەیس: " + error.message);
                } else if (data && data.length > 0) {
                    batchRecordIds[currentBatch] = data[0].id;
                    batchData.id = data[0].id;
                    batchData.is_saved = true;
                    alert("داتای پارەی هێنراوە بە سەرکەوتوویی تۆمارکرا!");
                }
            }
            saveAllBatchesToLocal();
            updateUIForCurrentBatch();
        } catch (err) {
            console.log("هەڵە لە پەیوەندیکردن بە داتابەیس:", err);
            alert("کێشەیەک ڕوویدا لە کاتی تۆمارکردندا.");
        }
    }

    async function updateDataInSupabase() {
        await saveDataToSupabase();
    }

    function closeModal() {
        document.getElementById('formModal').style.display = 'none';
        activeTimeField = null;
    }

    function openChangePasswordModal() {
        document.getElementById('current_password').value = '';
        document.getElementById('new_password').value = '';
        document.getElementById('confirm_password').value = '';
        document.getElementById('passwordModal').style.display = 'block';
    }

    function closePasswordModal() {
        document.getElementById('passwordModal').style.display = 'none';
    }

    async function updatePasswordInSupabase(e) {
        e.preventDefault();
        const currentPass = document.getElementById('current_password').value.trim();
        const newPass = document.getElementById('new_password').value.trim();
        const confirmPass = document.getElementById('confirm_password').value.trim();

        if (newPass !== confirmPass) {
            alert("پاسۆڕدی نوێ و دووبارەکراوەکەی یەکگرتوو نیین!");
            return;
        }

        try {
            const { data: users, error: fetchError } = await supabaseClient.from('users').select('*');
            if (fetchError) { alert("هەڵە لە پەیوەندیکردن بە داتابەیس."); return; }

            let userRecord = users.find(u => 
                (u.username === baseDriverName || u.name === baseDriverName || u.driver_name === baseDriverName)
            );

            if (!userRecord) { alert("هەژماری سایەق نەدۆزراوەتەوە لە داتابەیس."); return; }

            let dbPassword = userRecord.password || userRecord.pass;
            if (dbPassword && dbPassword !== currentPass) { alert("تێپەڕەوشەی ئێستا هەڵەیە!"); return; }

            let passwordColumnName = userRecord.password !== undefined ? 'password' : 'pass';
            const { error: updateError } = await supabaseClient.from('users').update({ [passwordColumnName]: newPass }).eq('id', userRecord.id);

            if (updateError) {
                alert("هەڵە لە گۆڕینی پاسۆڕد: " + updateError.message);
            } else {
                alert("تێپەڕەوشە بە سەرکەوتوویی گۆڕدرا!");
                closePasswordModal();
            }
        } catch (err) {
            console.log("هەڵە لە پرۆسەی گۆڕینی پاسۆڕد:", err);
            alert("هەڵەیەکی نەخوازراو ڕوویدا.");
        }
    }

    function saveFormData(e) {
        e.preventDefault();
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);
        const todayStr = now.toISOString().split('T')[0];

        let batchData = allBatchesData[currentBatch];
        let suffixArr = { 1: '', 2: ' دوو', 3: ' سێ', 4: ' چوار' };
        batchData.driver = baseDriverName + suffixArr[currentBatch];

        batchData.distributor = document.getElementById('distributor').value.trim();
        batchData.delegate = document.getElementById('delegate').value.trim();
        batchData.zone = document.getElementById('zone').value.trim();
        batchData.vehicle = document.getElementById('vehicle').value.trim();
        batchData.cargo_weight = Number(document.getElementById('cargo_weight').value) || 0;
        batchData.pieces_count = Number(document.getElementById('pieces_count').value) || 0;
        batchData.receipt_number = Number(document.getElementById('receipt_number').value) || 0;
        batchData.record_date = todayStr;

        if (activeTimeField) {
            if (batchData[activeTimeField]) {
                batchData[activeTimeField] = timeStr;
                batchData[`${activeTimeField}_edited`] = true;
            } else {
                batchData[activeTimeField] = timeStr;
            }
        }

        if (!batchData.record_time) { batchData.record_time = timeStr; }

        updateUIForCurrentBatch();
        closeModal();
        syncWithSupabase(batchData);
    }

    async function syncWithSupabase(batchData) {
        try {
            let dbData = {
                driver: batchData.driver,
                distributor: batchData.distributor || '-',
                delegate: batchData.delegate || '-',
                zone: batchData.zone || '-',
                vehicle: batchData.vehicle || '-',
                cargo_weight: Number(batchData.cargo_weight) || 0,
                pieces_count: Number(batchData.pieces_count) || 0,
                receipt_number: Number(batchData.receipt_number) || 0,
                record_date: batchData.record_date,
                record_time: batchData.record_time || '00:00',
                in_zone_time: batchData.in_zone_time || null,
                out_zone_time: batchData.out_zone_time || null,
                arrival_time: batchData.arrival_time || null,
                collected_money: batchData.collected_money === '' ? 0 : Number(String(batchData.collected_money).replace(/,/g, ''))
            };

            let recId = batchRecordIds[currentBatch];

            if (recId) {
                await supabaseClient.from('delivery_records').update(dbData).eq('id', recId);
            } else {
                const { data, error } = await supabaseClient.from('delivery_records').insert([dbData]).select();
                if (error) {
                    alert("هەڵە لە ناردنی داتا بۆ داتابەیس: " + error.message);
                }
                if (data && data.length > 0) {
                    batchRecordIds[currentBatch] = data[0].id;
                    batchData.id = data[0].id;
                }
            }
        } catch (err) {
            console.log("هەڵە لە ناردن بۆ داتابەیس:", err);
        }
    }
</script>
